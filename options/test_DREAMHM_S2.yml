# DREAM-HM -- test / reconstruction
# The reconstructed sinogram of every sample is written to
#   results_sinogram/DREAMHM_S2_test/visualization/<name>.mat   (key: sino_net1)
# and can then be turned into a PET image with reconstruction/run_osem.m
name: DREAMHM_S2_test
model_type: DREAMHM_S2Model
scale: 1
num_gpu: auto
manual_seed: 0

datasets:
  test:
    name: TestSet
    type: SinoHeatMaskDataset
    dataroot_GT: datasets/sinogram/test       # <- folder with the paired .mat sinograms
    dataroot_LQ: datasets/sinogram/test
    hot_ratio: 0.1            # tau = P90 of the padded 256x256 block (~13% of the 192-column sinogram)
    clean_channel: true
    normalize: false          # the test pipeline rescales by the peak of the block
    sino_h: 256
    sino_w: 192
    pad_w: 32

network_g:
  type: DREAMHM_S2
  n_encoder_res: 5
  inp_channels: 3
  out_channels: 3
  dim: 48
  num_blocks: [3, 5, 6, 6]
  num_refinement_blocks: 4
  heads: [1, 2, 4, 8]
  ffn_expansion_factor: 2
  bias: false
  LayerNorm_type: WithBias
  n_denoise_res: 1
  linear_start: 0.1
  linear_end: 0.99
  timesteps: 4

network_S1:
  type: DREAMHM_S1
  n_encoder_res: 5
  inp_channels: 3
  out_channels: 3
  dim: 48
  num_blocks: [3, 5, 6, 6]
  num_refinement_blocks: 4
  heads: [1, 2, 4, 8]
  ffn_expansion_factor: 2
  bias: false
  LayerNorm_type: WithBias

path:
  pretrain_network_g: experiments_sinogram/DREAMHM_S2/models/net_g_latest.pth
  pretrain_network_S1: experiments_sinogram/DREAMHM_S1/models/net_g_latest.pth
  param_key_g: params_ema
  strict_load_g: false
  ignore_resume_networks: network_S1

val:
  save_img: true
  suffix: ~
  metrics:
    psnr:
      type: calculate_psnr
      crop_border: 0
      test_y_channel: false
